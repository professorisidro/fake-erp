spring.application.name=fakeerp

# ==========================================================================
# H2 (armazenada em disco) - arquivo em ./data/fakeerp.mv.db
# AUTO_SERVER=TRUE permite acesso simultâneo pela aplicação e por ferramentas externas
# ==========================================================================
# NON_KEYWORDS=VALUE libera a coluna "value" (palavra reservada no H2)
spring.datasource.url=jdbc:h2:file:./data/fakeerp;AUTO_SERVER=TRUE;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin

# Console de gerenciamento do H2 -> http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:file:./data/fakeerp    User: admin    Password: admin
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ==========================================================================
# JPA / Hibernate - o esquema e a carga vêm do schema.sql / data.sql
# ==========================================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Executa schema.sql + data.sql tambem para bancos nao-embarcados (arquivo)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ==========================================================================
# JWT
# ==========================================================================
# Chave HMAC-SHA (Base64). Troque em producao!
app.jwt.secret=Zm9rZUVSUC1zdXBlci1zZWNyZXQta2V5LXBhcmEtYXNzaW5hci1KV1QtMjAyNi1IUzI1Ng==
# Validade do token em milissegundos (1h)
app.jwt.expiration-ms=3600000
app.jwt.issuer=fakeerp

# ==========================================================================
# Swagger / OpenAPI -> http://localhost:8080/swagger-ui.html
# ==========================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
server.forward-headers-strategy=framework

